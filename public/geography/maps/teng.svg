<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description"><title id="title">滕国地理关系图</title><desc id="description">今山东滕州一带的历史滕国区域。今地名仅供地域参照，古国疆界不等同现代市界。</desc><rect width="960" height="640" fill="#faf8f3"/><g font-family="'Songti SC','Noto Serif SC',serif"><text x="50" y="63" font-size="38" fill="#1c1a17" text-anchor="start">滕国</text><text x="50" y="102" font-size="21" fill="#6b6660" text-anchor="start">邦国 · 孔门人物地理图志</text><rect x="265" y="175" width="430" height="100" rx="3" fill="#f1ece3" stroke="#e5e0d8"/><text x="480" y="235" font-size="34" fill="#1c1a17" text-anchor="middle">滕国</text><text x="480" y="345" font-size="28" fill="#1c1a17" text-anchor="middle">邦国</text><text x="480" y="397" font-size="24" fill="#6b6660" text-anchor="middle">具体地望与范围，详见文献说明</text><text x="50" y="525" font-size="21" fill="#6b6660" text-anchor="start">地理关系示意 · 不作精确定位</text><text x="50" y="567" font-size="21" fill="#6b6660" text-anchor="start">今山东滕州一带的历史滕国区域</text><text x="910" y="621" font-size="15" fill="#6b6660" text-anchor="end">lunyu.ai · 据所列文献整理</text></g></svg>
