name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: quality
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://www.lunyu.ai

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm run qa:provenance -- --checkout-only

      - run: npm ci

      - run: npm run build

      - run: npm run qa:seo

      - run: npm run qa:biographies -- --built

      - run: npm run qa:coverage
